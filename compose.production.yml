services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:?API_URL es obligatoria}

      # Hosts autorizados para Angular SSR
      #NG_ALLOWED_HOSTS: '127.0.0.1,localhost,192.168.18.29'
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:?Obligatorio}

    ports:
      - '127.0.0.1:4000:4000'

    networks:
      - ferreteria_network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ferreteria_network:
    external: true
