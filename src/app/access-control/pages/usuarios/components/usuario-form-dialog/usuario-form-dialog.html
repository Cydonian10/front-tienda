<app-dialog-shell title="Nuevo usuario" [titleId]="titleId">
  <form [id]="formId" (submit)="$event.preventDefault(); save()" class="space-y-4" novalidate>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block space-y-2 text-sm font-semibold">
        Nombres
        <input class="input w-full" autocomplete="given-name"
          [formField]="userForm.person.firstName"
          [class.input-error]="userForm.person.firstName().touched() && userForm.person.firstName().invalid()"
          [attr.aria-describedby]="userForm.person.firstName().touched() && userForm.person.firstName().invalid() ? 'first-name-errors' : null" />
        <app-field-errors [field]="userForm.person.firstName()" errorId="first-name-errors" />
      </label>
      <label class="block space-y-2 text-sm font-semibold">
        Apellidos
        <input class="input w-full" autocomplete="family-name"
          [formField]="userForm.person.lastName"
          [class.input-error]="userForm.person.lastName().touched() && userForm.person.lastName().invalid()"
          [attr.aria-describedby]="userForm.person.lastName().touched() && userForm.person.lastName().invalid() ? 'last-name-errors' : null" />
        <app-field-errors [field]="userForm.person.lastName()" errorId="last-name-errors" />
      </label>
      <label class="block space-y-2 text-sm font-semibold">
        Documento de identidad
        <input class="input w-full"
          [formField]="userForm.person.identityDocument"
          [class.input-error]="userForm.person.identityDocument().touched() && userForm.person.identityDocument().invalid()"
          [attr.aria-describedby]="userForm.person.identityDocument().touched() && userForm.person.identityDocument().invalid() ? 'document-errors' : null" />
        <app-field-errors [field]="userForm.person.identityDocument()" errorId="document-errors" />
      </label>
      <label class="block space-y-2 text-sm font-semibold">
        Fecha de nacimiento
        <input class="input w-full" type="date" [max]="today"
          [formField]="userForm.person.dateOfBirth"
          [class.input-error]="userForm.person.dateOfBirth().touched() && userForm.person.dateOfBirth().invalid()"
          [attr.aria-describedby]="userForm.person.dateOfBirth().touched() && userForm.person.dateOfBirth().invalid() ? 'birth-errors' : null" />
        <app-field-errors [field]="userForm.person.dateOfBirth()" errorId="birth-errors" />
      </label>
    </div>
    <label class="block space-y-2 text-sm font-semibold">
      Correo electrónico
      <input class="input w-full" type="email" autocomplete="email"
        [formField]="userForm.email"
        [class.input-error]="userForm.email().touched() && userForm.email().invalid()"
        [attr.aria-describedby]="userForm.email().touched() && userForm.email().invalid() ? 'email-errors' : null" />
      <app-field-errors [field]="userForm.email()" errorId="email-errors" />
    </label>
    <label class="block space-y-2 text-sm font-semibold">
      Nombre de usuario
      <input class="input w-full" autocomplete="username"
        [formField]="userForm.nickName"
        [class.input-error]="userForm.nickName().touched() && userForm.nickName().invalid()"
        [attr.aria-describedby]="userForm.nickName().touched() && userForm.nickName().invalid() ? 'nickname-errors' : null" />
      <app-field-errors [field]="userForm.nickName()" errorId="nickname-errors" />
    </label>
    <label class="block space-y-2 text-sm font-semibold">
      Contraseña
      <input class="input w-full" type="password" autocomplete="new-password"
        [formField]="userForm.password"
        [class.input-error]="userForm.password().touched() && userForm.password().invalid()"
        [attr.aria-describedby]="userForm.password().touched() && userForm.password().invalid() ? 'password-errors' : null" />
      <app-field-errors [field]="userForm.password()" errorId="password-errors" />
    </label>
    @if (addUsuarioMutation.isError()) {
      <div class="alert alert-error alert-soft" role="alert">
        No se pudo crear el usuario. Revisa los datos e inténtalo de nuevo.
      </div>
    }
  </form>
  <div dialog-actions class="flex flex-col gap-2 sm:flex-row">
    <button type="button" class="btn" data-dialog-cancel
      [disabled]="addUsuarioMutation.isPending()" (click)="dialogRef.close()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [attr.form]="formId"
      [disabled]="addUsuarioMutation.isPending()">
      {{ addUsuarioMutation.isPending() ? 'Creando…' : 'Crear usuario' }}
    </button>
  </div>
</app-dialog-shell>
