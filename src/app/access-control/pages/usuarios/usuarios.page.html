<header>
  <nav class="mb-3 text-xs text-base-content/70" aria-label="Ruta de navegación">
    Administración <span class="mx-2" aria-hidden="true">›</span>
    <span class="font-semibold text-primary" aria-current="page">Usuarios</span>
  </nav>
  <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Usuarios</h1>
  <p class="mt-1 text-sm text-base-content/70">Consulta las cuentas de usuario.</p>
</header>

@if (findUserQuery.isPending()) {
  <div class="flex items-center gap-3 rounded-box border border-base-300 bg-base-100 p-5" role="status">
    <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
    Cargando usuarios…
  </div>
} @else if (findUserQuery.isError()) {
  <div class="alert alert-error alert-soft flex-wrap" role="alert">
    <span>No se pudieron cargar los usuarios. Comprueba la conexión e inténtalo de nuevo.</span>
    <button class="btn btn-sm" type="button" (click)="findUserQuery.refetch()">Reintentar</button>
  </div>
} @else {
  <div class="max-w-2xl">
    <app-usuarios-list
      [users]="findUserQuery.data() ?? []"
      [filteredUsers]="filteredUsers()"
      [search]="search()"
      [status]="status()"
      (searchChange)="search.set($event)"
      (statusChange)="status.set($event)"
    />
  </div>
}
