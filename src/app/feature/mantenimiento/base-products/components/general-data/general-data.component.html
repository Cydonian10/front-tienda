<section class="card border border-base-300 bg-base-100">
  <div class="card-body gap-6 p-6 sm:p-8">
    <header class="space-y-1">
      <h2 class="card-title text-lg">Datos generales</h2>
      <p class="text-sm text-base-content/60">Información básica del producto base.</p>
    </header>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="name" class="text-sm font-medium">
          Nombre
          <span class="text-error">*</span>
        </label>
        <input
          id="name"
          type="text"
          class="input input-bordered w-full"
          placeholder="Ej. Clavo"
          [formControl]="nameControl()"
        />
        @if (nameControl().invalid && nameControl().touched) {
          <p class="text-sm text-error">El nombre es obligatorio</p>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="brandId" class="text-sm font-medium">Marca</label>
        <select id="brandId" class="select select-bordered w-full" [formControl]="brandIdControl()">
          <option value="">Sin marca</option>
          @for (brand of brands(); track brand.id) {
            <option [value]="brand.id">{{ brand.name }}</option>
          }
        </select>
      </div>
    </div>
  </div>
</section>
