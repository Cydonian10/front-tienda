<ng-breadcrumbs />

<div class="space-y-4">
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <h3 class="text-lg font-bold">Marcas</h3>
    <div class="flex flex-wrap items-center gap-2">
      <label class="input w-50">
        <app-icon name="search" />
        <input type="search" placeholder="Buscar marca..." (input)="onSearch($event)" />
      </label>
      <button type="button" class="btn" (click)="openCreateDialog()">
        <app-icon name="plus" />
        Nueva marca
      </button>
    </div>
  </div>

  @if (brands.isLoading()) {
    <div class="flex justify-center py-16">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else if (errorMessage(); as message) {
    <div role="alert" class="alert alert-error">
      <span>{{ message }}</span>
    </div>
  } @else {
    <div class="overflow-x-auto rounded-box border border-base-300 bg-base-100">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody>
          @for (brand of brands.value()?.data; track brand.id) {
            <tr>
              <th>{{ brand.id }}</th>
              <td>{{ brand.name }}</td>
              <td>{{ brand.description ?? '—' }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="py-8 text-center text-base-content/60">No hay marcas</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <ng-pagination
      [total]="brands.value()?.total ?? 0"
      [lastPage]="brands.value()?.lastPage ?? 0"
      [(page)]="page"
      [(pageSize)]="pageSize"
    />
  }
</div>
