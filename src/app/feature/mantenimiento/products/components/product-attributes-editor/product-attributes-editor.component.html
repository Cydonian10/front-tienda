<div
  [formArray]="attributeRows()"
  cdkDropList
  [cdkDropListData]="attributeRows().controls"
  (cdkDropListDropped)="dropAttribute($event)"
  class="space-y-3"
>
  @for (row of attributeRows().controls; track row; let index = $index) {
    <div [formGroupName]="index" cdkDrag class="rounded-box border border-base-300 bg-base-100 p-3">
      <div class="flex items-start gap-3">
        <div class="min-w-0 flex-1">
          <div class="mb-3 flex flex-wrap items-center gap-2">
            <span class="text-sm text-base-content/60">Atributo {{ index + 1 }}</span>
            <button
              type="button"
              cdkDragHandle
              class="btn btn-ghost btn-sm cursor-grab touch-none"
              aria-label="Mover atributo"
              title="Mover atributo"
            >
              Mover
            </button>
          </div>

          <product-attribute-picker
            [attributes]="attributes()"
            [excludedAttributeIds]="selectedAttributeIds(row.controls.attributeId.value)"
            [selectedAttributeId]="row.controls.attributeId.value"
            [selectedValueId]="row.controls.attributeValueId.value"
            (attributeSelected)="setAttribute(row, $event)"
            (valueSelected)="setAttributeValue(row, $event)"
            (removed)="removeAttribute(index)"
          />
        </div>
      </div>
    </div>
  }
</div>

<button type="button" class="btn btn-soft btn-sm mt-4" (click)="addAttribute()">
  Agregar atributo
</button>
