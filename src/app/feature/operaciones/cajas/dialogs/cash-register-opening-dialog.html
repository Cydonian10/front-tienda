<div class="card w-full bg-base-100 shadow-xl">
  <div class="card-body gap-4">
    <div>
      <h2 class="card-title">Abrir caja</h2>
      <p class="text-sm text-base-content/60">
        {{ data.register.code }} · {{ data.register.name }}
      </p>
    </div>
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Monto inicial</legend>
        <input
          type="number"
          min="0"
          step="0.01"
          class="input w-full"
          formControlName="openingAmount"
          [class.input-error]="
            form.controls.openingAmount.touched && form.controls.openingAmount.invalid
          "
        />
        <p
          class="fieldset-label text-error"
          [class.hidden]="!form.controls.openingAmount.touched || form.controls.openingAmount.valid"
        >
          El monto debe ser mayor o igual a cero.
        </p>
      </fieldset>
      @if (data.isAdmin) {
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Responsable</legend>
          <select class="select w-full" formControlName="responsibleId">
            <option [ngValue]="data.currentPerson.id">
              {{ data.currentPerson.firstName }} {{ data.currentPerson.lastName }}
            </option>
            @for (person of data.responsibles; track person.id) {
              @if (person.id !== data.currentPerson.id) {
                <option [ngValue]="person.id">{{ person.firstName }} {{ person.lastName }}</option>
              }
            }
          </select>
        </fieldset>
      } @else {
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Responsable</legend>
          <input
            class="input w-full"
            [value]="data.currentPerson.firstName + ' ' + data.currentPerson.lastName"
            readonly
          />
        </fieldset>
      }
      @if (error(); as message) {
        <div role="alert" class="alert alert-error">
          <span>{{ message }}</span>
        </div>
      }
      <div class="card-actions justify-end">
        <button type="button" class="btn btn-soft" (click)="close()">Cancelar</button
        ><button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="loading loading-spinner"></span>
          }
          Abrir caja
        </button>
      </div>
    </form>
  </div>
</div>
