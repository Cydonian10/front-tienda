<form class="min-w-0" (submit)="save($event)" novalidate aria-labelledby="categoria-form-title">
  <header class="flex items-center justify-between gap-3 border-b border-base-300 px-5 py-4 sm:px-6">
    <h2 id="categoria-form-title" class="text-lg font-semibold tracking-tight">
      {{ category() ? 'Editar categoría' : 'Nueva categoría' }}
    </h2>
    <button type="button" class="btn btn-ghost btn-square min-h-11 min-w-11" [disabled]="saving()"
      aria-label="Cerrar" (click)="cancelled.emit()">
      <app-icon name="close" size="18" />
    </button>
  </header>

  <div class="space-y-5 px-5 py-5 sm:px-6">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Nombre <span class="text-error">*</span></legend>
      <div class="input min-h-11 w-full" [class.input-error]="!!validation()">
        <input id="category-name" type="text" class="min-w-0 grow" autocomplete="off" maxlength="201"
          aria-label="Nombre" cdkFocusInitial [value]="name()" [attr.aria-invalid]="!!validation()"
          [attr.aria-describedby]="validation() ? 'category-validation' : null"
          (input)="name.set($any($event.target).value)" />
      </div>
      @if (validation()) { <p id="category-validation" class="text-sm text-error" role="alert">{{ validation() }}</p> }
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Descripción (opcional)</legend>
      <textarea id="category-description" class="textarea min-h-24 w-full" aria-label="Descripción (opcional)"
        [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
      <p class="label">Déjala vacía para quitar la descripción.</p>
    </fieldset>

    @if (serverError()) { <div class="alert alert-error alert-soft" role="alert">{{ serverError() }}</div> }
  </div>

  <footer class="modal-action mt-0 flex flex-col-reverse gap-2 border-t border-base-300 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
    <button type="button" class="btn min-h-11 w-full sm:w-auto" [disabled]="saving()" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary min-h-11 w-full sm:w-auto" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : category() ? 'Guardar cambios' : 'Crear categoría' }}
    </button>
  </footer>
</form>
