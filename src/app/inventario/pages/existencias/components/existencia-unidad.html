@if (fila().unidadesSecundarias.length) {
  <label class="mt-2 block text-xs font-normal text-base-content/70 xl:mt-1">
    <span class="block">Ver en otra unidad</span>
    <select
      class="select select-sm mt-1 min-h-11 w-full max-w-48 text-base-content xl:mt-0.5 xl:h-9 xl:min-h-9 xl:w-36"
      [value]="unidadId() ?? ''"
      (change)="cambiarUnidad($any($event.target).value)"
    >
      <option value="">Unidad base</option>
      @for (opcion of fila().unidadesSecundarias; track opcion.id) {
        <option [value]="opcion.id">
          {{ opcion.nombre }} (× {{ decimalCompacto(opcion.factorABase) }})
        </option>
      }
    </select>
  </label>
  @if (conversion(); as texto) {
    <p
      class="mt-1 text-xs font-medium tabular-nums whitespace-normal break-words text-base-content"
      role="status"
    >
      {{ texto }}
    </p>
  }
}
