<header class="mb-7 flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
  <div class="min-w-0">
    <p class="mb-2 text-xs font-bold tracking-widest text-base-content/60 uppercase">
      Catálogo / Producto prueba
    </p>
    <h1 id="admin-section-title" class="text-3xl font-bold tracking-tight sm:text-4xl">
      {{ mode() === 'create' ? 'Crear producto' : 'Gestionar variantes' }}
    </h1>
    <p class="mt-2 max-w-2xl text-sm leading-relaxed text-base-content/65">
      {{
        mode() === 'create'
          ? 'Configura la información, fotos, variantes y unidades en un solo flujo.'
          : 'Consulta las variantes y atributos de un producto existente.'
      }}
    </p>
  </div>
  <div class="flex shrink-0 flex-wrap gap-2" aria-label="Vistas de productos">
    <button
      type="button"
      class="btn btn-sm sm:btn-md"
      [class.btn-primary]="mode() === 'create'"
      [class.btn-outline]="mode() !== 'create'"
      [attr.aria-pressed]="mode() === 'create'"
      (click)="create.emit()"
    >
      <app-icon name="plus" [size]="16" /> Crear producto
    </button>
    <button
      type="button"
      class="btn btn-sm sm:btn-md"
      [class.btn-primary]="mode() === 'manage'"
      [class.btn-outline]="mode() !== 'manage'"
      [attr.aria-pressed]="mode() === 'manage'"
      (click)="manage.emit()"
    >
      Gestionar producto existente
    </button>
  </div>
</header>
