<nav class="card card-border bg-base-100" aria-label="Pasos de creación">
  <div class="card-body gap-1 p-3 sm:p-4">
    <p class="px-3 pb-2 text-xs font-bold tracking-widest text-base-content/55 uppercase">
      Configuración
    </p>
    <div class="grid grid-cols-2 gap-1 sm:grid-cols-4 lg:grid-cols-1">
      @for (item of steps(); track item.title; let i = $index) {
        <button
          type="button"
          class="flex min-h-14 items-center gap-2 rounded-field px-2 py-2 text-left transition-colors sm:gap-3 sm:px-3"
          [class.bg-primary/10]="step() === i"
          [class.text-primary]="step() === i"
          [attr.aria-current]="step() === i ? 'step' : null"
          (click)="stepSelected.emit(i)"
        >
          <span
            class="grid size-7 shrink-0 place-items-center rounded-full border text-xs font-bold"
            [class.border-primary]="step() === i"
            [class.bg-primary]="step() === i"
            [class.text-primary-content]="step() === i"
            [class.border-base-300]="step() !== i"
          >
            @if (i < step()) {
              <app-icon name="check" [size]="14" />
            } @else {
              {{ i + 1 }}
            }
          </span>
          <span class="min-w-0">
            <strong class="block text-xs leading-tight sm:text-sm">{{ item.title }}</strong>
            <span class="mt-0.5 hidden text-xs leading-tight text-base-content/60 sm:block">{{
              item.detail
            }}</span>
          </span>
        </button>
      }
    </div>
    <div
      class="mt-4 hidden border-t border-base-300 px-3 pt-4 text-xs leading-relaxed text-base-content/65 lg:block"
    >
      <strong class="block text-base-content">Consejo</strong>
      Las existencias se registrarían después mediante una compra.
    </div>
  </div>
</nav>
