<!--
  Shell del admin: drawer de daisyUI.
  - En `lg` el sidebar queda fijo a la izquierda (`lg:drawer-open`).
  - En pantallas chicas se oculta y se abre con el botón hamburguesa del navbar.
-->
<div class="drawer h-dvh lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col overflow-y-auto">
    <app-navbar class="contents" />

    <main class="mx-auto w-full max-w-[1600px] flex-1 p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>

  <div class="drawer-side">
    <label for="admin-drawer" aria-label="Cerrar menú lateral" class="drawer-overlay"></label>
    <app-sidebar class="contents" />
  </div>
</div>
