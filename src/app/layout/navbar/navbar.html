<header
  class="navbar sticky top-0 z-30 min-h-16 gap-2 border-b border-base-300/70 bg-base-100/85 px-4 backdrop-blur-md sm:px-6"
>
  <div class="navbar-start gap-2">
    <!-- Toggle del drawer: solo visible en pantallas chicas -->
    <label
      for="admin-drawer"
      class="btn btn-ghost btn-square btn-sm lg:hidden"
      aria-label="Abrir menú lateral"
    >
      <app-icon name="bars-3" classes="size-5" />
    </label>

    <nav class="breadcrumbs text-sm" aria-label="Migas de pan">
      <ul>
        <li>
          <a class="text-base-content/55 transition-colors hover:text-base-content">UI Kit</a>
        </li>
        <li aria-current="page">
          <span class="font-semibold text-base-content">Form Layout</span>
        </li>
      </ul>
    </nav>
  </div>

  <div class="navbar-end gap-1">
    <button
      type="button"
      class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:text-base-content"
      aria-label="Buscar"
    >
      <app-icon name="search" classes="size-[1.15rem]" />
    </button>
    <!-- Acciones secundarias: se ocultan en pantallas chicas para no saturar el header -->
    <button
      type="button"
      class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:text-base-content max-sm:hidden"
      aria-label="Notificaciones"
    >
      <app-icon name="bell" classes="size-[1.15rem]" />
    </button>
    <button
      type="button"
      class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:text-base-content max-sm:hidden"
      aria-label="Mensajes"
    >
      <app-icon name="mail" classes="size-[1.15rem]" />
    </button>

    <!-- Apariencia, con indicador de estado activo -->
    <div class="indicator max-sm:hidden">
      <span class="indicator-item size-2 rounded-full bg-primary ring-2 ring-base-100"></span>
      <button
        type="button"
        class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:text-base-content"
        aria-label="Apariencia"
      >
        <app-icon name="swatch" classes="size-[1.15rem]" />
      </button>
    </div>

    <div class="avatar ml-1">
      <div class="size-8 rounded-full ring-1 ring-base-300">
        <img src="https://picsum.photos/seed/atlantis-admin/80/80" alt="Foto de perfil" />
      </div>
    </div>

    <a class="btn btn-sm ml-2 gap-2 border-base-300 bg-base-200 font-semibold hover:bg-base-300">
      <app-icon name="bookmark" classes="size-4" />
      <span class="hidden sm:inline">Today</span>
    </a>
  </div>
</header>
