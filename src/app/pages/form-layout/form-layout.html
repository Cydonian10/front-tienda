<div class="flex flex-col gap-6">
  <div class="grid grid-cols-1 items-start gap-6 xl:grid-cols-2">
    <!-- Columna izquierda -->
    <div class="flex flex-col gap-6">
      <!-- Vertical -->
      <section class="card bg-base-200">
        <div class="card-body gap-5">
          <h2 class="card-title text-base font-bold">Vertical</h2>
          <form class="flex flex-col gap-4" (submit)="$event.preventDefault()">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Name</legend>
              <input
                id="vertical-name"
                name="name"
                type="text"
                autocomplete="name"
                class="input w-full"
              />
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Email</legend>
              <input
                id="vertical-email"
                name="email"
                type="email"
                autocomplete="email"
                class="input w-full"
              />
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Age</legend>
              <input id="vertical-age" name="age" type="number" min="0" class="input w-full" />
            </fieldset>
          </form>
        </div>
      </section>

      <!-- Vertical Grid -->
      <section class="card bg-base-200">
        <div class="card-body gap-5">
          <h2 class="card-title text-base font-bold">Vertical Grid</h2>
          <form class="grid gap-4 sm:grid-cols-2" (submit)="$event.preventDefault()">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Name</legend>
              <input id="grid-name" name="name" type="text" class="input w-full" />
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Email</legend>
              <input id="grid-email" name="email" type="email" class="input w-full" />
            </fieldset>
          </form>
        </div>
      </section>
    </div>

    <!-- Columna derecha -->
    <div class="flex flex-col gap-6">
      <!-- Horizontal -->
      <section class="card bg-base-200">
        <div class="card-body gap-5">
          <h2 class="card-title text-base font-bold">Horizontal</h2>
          <form
            class="grid grid-cols-[5.5rem_1fr] items-center gap-x-4 gap-y-4"
            (submit)="$event.preventDefault()"
          >
            <label class="label text-base-content/70" for="horizontal-name">Name</label>
            <input id="horizontal-name" name="name" type="text" class="input w-full" />
            <label class="label text-base-content/70" for="horizontal-email">Email</label>
            <input id="horizontal-email" name="email" type="email" class="input w-full" />
          </form>
        </div>
      </section>

      <!-- Inline -->
      <section class="card bg-base-200">
        <div class="card-body gap-5">
          <h2 class="card-title text-base font-bold">Inline</h2>
          <form class="flex flex-wrap items-center gap-3" (submit)="$event.preventDefault()">
            <label class="sr-only" for="inline-firstname">Firstname</label>
            <input
              id="inline-firstname"
              name="firstname"
              type="text"
              placeholder="Firstname"
              autocomplete="given-name"
              class="input min-w-36 flex-1"
            />
            <label class="sr-only" for="inline-lastname">Lastname</label>
            <input
              id="inline-lastname"
              name="lastname"
              type="text"
              placeholder="Lastname"
              autocomplete="family-name"
              class="input min-w-36 flex-1"
            />
            <button type="submit" class="btn btn-primary px-6 font-semibold">Submit</button>
          </form>
        </div>
      </section>

      <!-- Help Text -->
      <section class="card bg-base-200">
        <div class="card-body gap-5">
          <h2 class="card-title text-base font-bold">Help Text</h2>
          <form (submit)="$event.preventDefault()">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Username</legend>
              <input
                id="help-username"
                name="username"
                type="text"
                autocomplete="username"
                aria-describedby="help-username-hint"
                class="input w-full"
              />
              <p id="help-username-hint" class="label text-wrap">
                Enter your username to reset your password.
              </p>
            </fieldset>
          </form>
        </div>
      </section>
    </div>
  </div>

  <!-- Advanced: ocupa todo el ancho -->
  <section class="card bg-base-200">
    <div class="card-body gap-5">
      <h2 class="card-title text-base font-bold">Advanced</h2>
      <form class="grid gap-4 md:grid-cols-2" (submit)="$event.preventDefault()">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Firstname</legend>
          <input
            id="adv-firstname"
            name="firstname"
            type="text"
            autocomplete="given-name"
            class="input w-full"
          />
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Lastname</legend>
          <input
            id="adv-lastname"
            name="lastname"
            type="text"
            autocomplete="family-name"
            class="input w-full"
          />
        </fieldset>
        <fieldset class="fieldset md:col-span-2">
          <legend class="fieldset-legend">Address</legend>
          <textarea
            id="adv-address"
            name="address"
            rows="4"
            autocomplete="street-address"
            class="textarea w-full"
          ></textarea>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">State</legend>
          <select id="adv-state" name="state" class="select w-full">
            <option disabled selected>Select One</option>
            <option>California</option>
            <option>Florida</option>
            <option>New York</option>
            <option>Texas</option>
          </select>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Zip</legend>
          <input
            id="adv-zip"
            name="zip"
            type="text"
            inputmode="numeric"
            autocomplete="postal-code"
            class="input w-full"
          />
        </fieldset>
      </form>
    </div>
  </section>
</div>
