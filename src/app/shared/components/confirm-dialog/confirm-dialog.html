<section
  class="max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-box border border-base-300 bg-base-100 p-6 text-base-content"
>
  <h2 [id]="titleId" class="break-words text-xl font-semibold leading-tight">{{ data.title }}</h2>
  <p [id]="messageId" class="mt-3 whitespace-pre-line break-words text-sm leading-relaxed">
    {{ data.message }}
  </p>

  <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
    <button type="button" class="btn" data-confirm-cancel (click)="dialogRef.close(false)">
      {{ data.cancelText ?? 'Cancelar' }}
    </button>
    <button
      type="button"
      class="btn"
      [class.btn-primary]="data.tone !== 'danger'"
      [class.btn-error]="data.tone === 'danger'"
      data-confirm-accept
      (click)="dialogRef.close(true)"
    >
      {{ data.confirmText ?? 'Confirmar' }}
    </button>
  </div>
</section>
