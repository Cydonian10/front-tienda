<section aria-labelledby="cajas-turnos-titulo" class="space-y-7">
  <app-cajas-turnos-header (crearCaja)="abrirCrearCaja()" />
  <app-cajas-turnos-resumen />

  <section aria-labelledby="listado-cajas-titulo" class="space-y-5">
    <app-cajas-filtro [filtro]="filtro()" />

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <label class="input w-full sm:max-w-xs">
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          class="size-4 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
          />
        </svg>
        <input
          type="search"
          aria-label="Buscar caja por nombre o código"
          placeholder="Buscar por nombre o código..."
          disabled
        />
      </label>
    </div>

    @if (listQuery.isPending()) {
      <p role="status" class="text-sm text-base-content/70">Cargando cajas...</p>
    } @else if (listQuery.isError()) {
      <div role="alert" class="text-sm text-error">
        No se pudieron cargar las cajas.
        <button type="button" class="btn btn-sm btn-ghost" (click)="listQuery.refetch()">
          Reintentar
        </button>
      </div>
    } @else if (cajas().length === 0) {
      <p class="text-sm text-base-content/70">No hay cajas para este filtro.</p>
    } @else {
      <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
        @for (caja of cajas(); track caja.id) {
          <app-caja-card [caja]="caja" />
        }
      </div>
    }
  </section>
</section>
