<article class="card card-border h-full bg-base-100">
  <div class="card-body gap-0 p-5">
    <div class="flex items-center justify-between gap-3">
      <h2 class="text-xs font-medium text-base-content/70">{{ titulo() }}</h2>
      <span class="rounded-field bg-base-200 p-2 text-base-content/60">
        <ng-content select="[icono]" />
      </span>
    </div>
    <p class="mt-4 text-2xl font-bold tabular-nums text-base-content">
      <ng-content select="[valor]" />
    </p>
    <p class="mt-2 text-xs text-base-content/70">
      <ng-content select="[descripcion]" />
    </p>
  </div>
</article>
