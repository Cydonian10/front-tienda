<app-dialog-shell title="Crear caja" [titleId]="titleId">
  <p class="mb-5 text-sm text-base-content/70">Cada caja representa un punto físico de efectivo.</p>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Nombre de la caja</legend>
    <input class="input w-full" type="text" placeholder="Ej. Caja del mostrador" [formField]="cajaForm.nombre" />
  </fieldset>

  <p class="mt-3 text-xs text-base-content/70">
    La creación de cajas estará disponible próximamente.
  </p>

  <div dialog-actions class="flex flex-col gap-2 sm:flex-row">
    <button type="button" class="btn" data-dialog-cancel (click)="dialogRef.close()">
      Cancelar
    </button>
    <button type="button" class="btn btn-primary" disabled>Crear caja</button>
  </div>
</app-dialog-shell>
