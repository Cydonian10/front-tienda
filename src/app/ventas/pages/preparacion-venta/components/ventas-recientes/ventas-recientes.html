<section class="card card-border bg-base-100">
  <div class="card-body gap-0 p-6">
    <h2 class="text-lg font-bold">Ventas recientes</h2>
    @for (venta of ventas(); track venta.id) {
      <div
        class="mt-5 flex flex-wrap items-center justify-between gap-4 border-t border-base-300 pt-4"
      >
        <div>
          <p class="text-sm font-semibold">{{ venta.id }}</p>
          <p class="mt-1 text-xs text-base-content/70">{{ venta.caja }}</p>
        </div>
        <div class="flex items-center gap-4">
          <strong class="text-sm tabular-nums">S/ {{ venta.total | number: '1.2-2' }}</strong>
          <button type="button" class="btn btn-ghost btn-sm" (click)="verTicket.emit(venta)">
            Ver ticket
          </button>
        </div>
      </div>
    } @empty {
      <p class="mt-5 border-t border-base-300 pt-4 text-sm text-base-content/70">
        No hay ventas recientes.
      </p>
    }
  </div>
</section>
