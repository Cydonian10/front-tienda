<section class="space-y-6" aria-labelledby="punto-venta-titulo">
  <app-punto-venta-header />
  <div class="grid items-start gap-5 lg:grid-cols-[1.08fr_0.92fr]">
    <app-preparacion-venta
      [almacen]="almacen()"
      [turno]="turno()"
      [almacenes]="almacenesQuery.data()?.data ?? []"
      [turnos]="turnos()"
      [almacenesCargando]="almacenesQuery.isPending()"
      [almacenesError]="almacenesQuery.isError()"
      [turnosCargando]="cajasQuery.isPending()"
      [turnosError]="cajasQuery.isError()"
      (almacenChange)="almacen.set($event)"
      (turnoChange)="turno.set($event)"
      (continuar)="continuar()"
      (reintentarAlmacenes)="almacenesQuery.refetch()"
      (reintentarTurnos)="cajasQuery.refetch()"
    />
    <div class="space-y-5">
      <app-pasos-venta />
      <app-ventas-recientes [ventas]="[]" />
    </div>
  </div>
</section>
