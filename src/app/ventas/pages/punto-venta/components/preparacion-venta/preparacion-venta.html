<section class="card card-border bg-base-100">
  <div class="card-body gap-0 p-6 sm:p-8">
    <app-preparacion-venta-header />

    <div class="mt-7 space-y-6">
      <div class="flex gap-4">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full border border-primary/30 text-xs font-semibold text-primary"
          >1</span
        >
        <div class="min-w-0 flex-1">
          <label for="almacen" class="block text-sm font-semibold">Almacén</label>
          <p id="almacen-ayuda" class="mt-1 text-xs text-base-content/70">
            ¿De dónde salen los productos?
          </p>
          <select
            id="almacen"
            class="select mt-3 w-full"
            [value]="almacen()"
            (change)="seleccionar($event, 'almacen')"
            aria-describedby="almacen-ayuda"
          >
            <option value="">Selecciona un almacén</option>
            <option value="Almacén principal">Almacén principal · ejemplo</option>
            <option value="Almacén secundario">Almacén secundario · ejemplo</option>
          </select>
        </div>
      </div>
      <div class="flex gap-4">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full border border-primary/30 text-xs font-semibold text-primary"
          >2</span
        >
        <div class="min-w-0 flex-1">
          <label for="turno" class="block text-sm font-semibold">Turno de caja abierto</label>
          <p id="turno-ayuda" class="mt-1 text-xs text-base-content/70">
            ¿Dónde se registraría el cobro?
          </p>
          <select
            id="turno"
            class="select mt-3 w-full"
            [value]="turno()"
            (change)="seleccionar($event, 'turno')"
            aria-describedby="turno-ayuda"
          >
            <option value="">Selecciona un turno</option>
            <option value="Caja principal">Caja principal · turno de ejemplo</option>
          </select>
          <p class="mt-4 text-xs text-base-content/70">
            <span class="mr-2 inline-block size-2 rounded-full bg-success" aria-hidden="true"></span
            >Se muestra un turno de ejemplo.
          </p>
          <button
            class="btn btn-primary mt-5 w-full justify-between"
            type="button"
            [disabled]="!almacen() || !turno()"
            (click)="continuar.emit()"
          >
            Continuar a vender <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
