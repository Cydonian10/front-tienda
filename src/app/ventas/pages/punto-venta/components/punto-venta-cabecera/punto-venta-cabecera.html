<header class="space-y-6">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 id="nueva-venta-titulo" class="text-2xl font-bold tracking-tight sm:text-3xl">
        Nueva venta
      </h1>
      <p class="mt-2 text-sm text-base-content/70">Agrega productos y cobra de forma sencilla.</p>
    </div>

    <button type="button" class="btn btn-outline min-h-11" disabled>
      <svg
        aria-hidden="true"
        class="size-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 3h12v18l-2-1-2 1-2-1-2 1-2-1-2 1V3Zm3 5h6M9 12h6M9 16h4"
        />
      </svg>
      Ventas recientes
    </button>
  </div>

  <div class="card card-border bg-base-100">
    <div class="flex flex-col gap-4 p-4 sm:flex-row sm:flex-wrap sm:items-center sm:gap-6">
      <div class="flex items-center gap-3">
        <span
          class="flex size-11 shrink-0 items-center justify-center rounded-field bg-success/15 text-success"
        >
          <svg
            aria-hidden="true"
            class="size-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"
            />
          </svg>
        </span>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-base-content/60">Almacén</p>
          <p class="mt-1 text-sm font-semibold">{{ almacen() }}</p>
        </div>
      </div>

      <div class="flex items-center gap-3 sm:border-l sm:border-base-300 sm:pl-6">
        <span
          class="flex size-11 shrink-0 items-center justify-center rounded-field bg-success/15 text-success"
        >
          <svg
            aria-hidden="true"
            class="size-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 5h16v14H4zM7 8h10v6H7zM7 17h2m3 0h5"
            />
          </svg>
        </span>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-base-content/60">
            Caja y turno <span class="ml-1 text-success">• Abierto</span>
          </p>
          <p class="mt-1 text-sm font-semibold">{{ caja() }} · #{{ numeroTurno() }}</p>
        </div>
      </div>

      <div class="flex items-center justify-between gap-4 sm:ml-auto sm:justify-start">
        <div>
          <p class="text-xs text-base-content/60">Responsable del turno</p>
          <p class="mt-1 text-sm font-semibold">{{ responsable() }}</p>
        </div>
      </div>
    </div>
  </div>
</header>
