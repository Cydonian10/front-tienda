<section class="space-y-6" aria-labelledby="punto-venta-titulo">
  <app-punto-venta-header />
  <div class="grid items-start gap-5 lg:grid-cols-[1.08fr_0.92fr]">
    <app-preparacion-venta
      [almacen]="almacen()"
      [turno]="turno()"
      (almacenChange)="almacen.set($event)"
      (turnoChange)="turno.set($event)"
      (continuar)="vista.set('venta')"
    />
    <div class="space-y-5">
      <app-pasos-venta />
      <app-ventas-recientes
        [ventas]="ventasRecientes()"
        (verTicket)="
          ventaRecienteSeleccionada.set($event); ticketReciente.set(true); vista.set('ticket')
        "
      />
    </div>
  </div>
</section>
