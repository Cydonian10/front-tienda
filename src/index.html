<!doctype html>
<html lang="en" data-theme="atlantis">
  <head>
    <meta charset="utf-8" />
    <title>Atlantis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: oklch(16.5% 0.008 264);
      }

      #app-splash .spinner {
        width: 3rem;
        height: 3rem;
        border-radius: 9999px;
        border: 3px solid oklch(25.5% 0.012 264);
        border-top-color: oklch(72% 0.155 160);
        animation: splash-spin 0.8s linear infinite;
      }

      #app-splash .title {
        font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: oklch(93% 0.008 264);
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div id="app-splash" role="status" aria-label="Cargando">
        <div class="spinner"></div>
        <span class="title">Atlantis</span>
      </div>
    </app-root>
  </body>
</html>
